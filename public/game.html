    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden;
      font-family: 'Amfost', sans-serif;
      background: transparent;
    }

    canvas { display: block; }

    /* ---------------- HUD ---------------- */
    #hud-moedas {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.4);
      padding: 10px 20px;
      border-radius: 16px;
      z-index: 5;
    }

    #hud-moedas img { width: 40px; height: 40px; margin-right: 8px; }

    #hud-moedas span {
      color: white;
      font-size: 28px;
      font-family: 'Amfost';
      text-shadow: 2px 2px 3px rgba(0,0,0,0.6);
    }

    #btn-mover {
      position: absolute;
      bottom: 20px;
      right: 140px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 5;
    }
    #btn-mover img { width: 65px; height: 65px; }

    #btn-fullscreen {
      position: absolute;
      bottom: 165px;
      right: 25px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 5;
     }
     #btn-fullscreen img { width: 40px; height: 40px; }

    #btn-config {
      position: absolute;
      bottom: 165px;
      right: 80px;

<!-- ======= Script de Bloqueio da NPC Aradora (versão final anti-clique duplo) ======= -->


<script>
document.addEventListener('DOMContentLoaded', function() {
  const card = document.getElementById('item-npc-aradora');
  if (!card) return;

  const LOCK_ICON_SRC = "https://i.postimg.cc/HnL0T86b/icone-bloqueado.png";

  // === Aplica bloqueio visual ===
  function bloquearCardAradora() {
    card.dataset.bloqueado = "true";
    card.classList.add('bloqueado');
    card.style.pointerEvents = "none";
    card.style.filter = "grayscale(0.7) brightness(0.4)";

    let overlay = card.querySelector(".lock-overlay");
    if (!overlay) {
      overlay = document.createElement("img");
      overlay.src = LOCK_ICON_SRC;
      overlay.classList.add("lock-overlay");
      Object.assign(overlay.style, {
        position: "absolute",
        top: "10px",
        right: "20px",
        width: "100px",
        height: "100px",
        zIndex: "5",
        pointerEvents: "none"
      });
      card.appendChild(overlay);
    }
  }

  // === Remove bloqueio, caso necessário ===
  function desbloquearCardAradora() {
    card.dataset.bloqueado = "false";
    card.classList.remove('bloqueado');
    card.style.pointerEvents = "auto";
    card.style.filter = "none";
    const overlay = card.querySelector(".lock-overlay");
    if (overlay) overlay.remove();
  }

  // === Limpa qualquer seleção da loja (completa) ===
  function limparSelecaoLoja() {
    if (typeof itemSelecionado !== 'undefined') itemSelecionado = null;
    if (typeof itemAtual !== 'undefined') itemAtual = null;
    if (typeof modoColocar !== 'undefined') modoColocar = null;
    if (typeof placingItem !== 'undefined') placingItem = null;
    if (typeof preview !== 'undefined' && preview.active) preview.active = false;

    // remove destaque visual de todos os cards
    document.querySelectorAll('.card-item').forEach(c => c.classList.remove('selecionado'));
    document.querySelectorAll('.card-item').forEach(c => c.style.outline = '');
  }

  // === Atualiza bloqueio conforme o estado da Aradora ===
  function atualizarBloqueioAradora() {
    if (typeof aradora !== 'undefined' && aradora.spawned) {
      bloquearCardAradora();
    } else {
      desbloquearCardAradora();
    }
  }

  // === Atualiza bloqueio ao abrir a loja ===
  const btnLojaFix = document.getElementById("btn-loja");
  if (btnLojaFix) {
    btnLojaFix.addEventListener("click", atualizarBloqueioAradora);
  }

  // === Aplica bloqueio inicial, se necessário ===
  atualizarBloqueioAradora();

  // === Clique no card da Aradora ===
  card.addEventListener('click', (event) => {
    event.stopPropagation();
    event.preventDefault();

    //  desmarca e limpa tudo imediatamente (antes de qualquer ação)
    limparSelecaoLoja();
    card.classList.remove('selecionado');

    if (card.classList.contains('bloqueado') || card.dataset.bloqueado === "true") return;

    // usa a variável global 'moedas' (mesma usada pelo HUD)
    const saldo = (typeof moedas === 'number')
      ? moedas
      : parseInt(document.getElementById('valor-moedas')?.textContent || '0');

    // obtém preço do card
    let preco = parseInt(card.dataset.preco || '0');
    if (!preco) preco = 9000;

    // saldo insuficiente
    if (saldo < preco) {
      limparSelecaoLoja(); // garante que nada fica ativo
      return;
    }

    // desconta moedas
    if (typeof moedas === 'number') {
      moedas -= preco;
      if (typeof moedasSpan !== 'undefined' && moedasSpan) moedasSpan.textContent = moedas;
    } else {
      const el = document.getElementById('valor-moedas');
      if (el) el.textContent = Math.max(0, saldo - preco);
    }

    // adiciona XP
    if (typeof addXP === 'function') addXP(Number(card.dataset.xp||200));
    else if (typeof player !== 'undefined') player.xp = (player.xp || 0) + Number(card.dataset.xp||200);

    // spawna a Aradora
    if (typeof aradora !== 'undefined') {
      aradora.spawned = true;
      const pos = gridToScreen(player.gx + 1, player.gy);
      aradora.gx = player.gx + 1;
      aradora.gy = player.gy;
      aradora.x = pos.x;
      aradora.y = pos.y;

      // bloqueia imediatamente após spawn
      bloquearCardAradora();

      // 🔒 e garante que o item não fica selecionado de novo
      limparSelecaoLoja();
    } else {
      alert('Erro: objeto aradora não encontrado.');
    }
  });
});

  function parsePreco(precoStr) {
  if (!precoStr) return 0;
  precoStr = precoStr.toString().toLowerCase();
  if (precoStr.endsWith('k')) {
    return parseFloat(precoStr) * 1000;
  }
  return parseInt(precoStr);
}
</script>

document.addEventListener("DOMContentLoaded", function() {
  const canvas = document.querySelector('canvas');
  if (!canvas) return;



  // -----------------------------
  // Gestos de toque (mobile):
  // - 1 dedo: tap (clique) ou arrastar para mover a câmera
  // - 2 dedos: pinça para zoom suave
  // -----------------------------

  let touchMode = null; // 'tap' | 'pan' | 'pinch'
  let touchStartX = 0, touchStartY = 0;
  let lastTouchX = 0, lastTouchY = 0;
  let touchStartTime = 0;
  let cameraStartX = 0, cameraStartY = 0; let touchVX = 0, touchVY = 0, touchLastT = 0;

  let pinchStartDist = 0;
  let pinchStartZoom = 1;

  const TAP_MAX_MOVEMENT = 10;     // px
  const TAP_MAX_DURATION = 250;    // ms

  function getTouchesDistance(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
  }

  function dispatchMouseLikeClick(x, y) {
    const opts = {
      bubbles: true,
      cancelable: true,
      view: window,
      clientX: x,
      clientY: y,
      button: 0
    };
    canvas.dispatchEvent(new MouseEvent('mousedown', opts));
    canvas.dispatchEvent(new MouseEvent('mouseup', opts));
    canvas.dispatchEvent(new MouseEvent('click', opts));
  }

  canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      touchMode = 'tap'; touchVX=touchVY=0;touchLastT=performance.now();window.MFAdapter?.cancelGlide();
      touchStartX = lastTouchX = t.clientX;
      touchStartY = lastTouchY = t.clientY;
      touchStartTime = (performance && performance.now) ? performance.now() : Date.now();
      cameraStartX = typeof offsetX === 'number' ? offsetX : 0;
      cameraStartY = typeof offsetY === 'number' ? offsetY : 0;
    } else if (e.touches.length === 2) {
      const [t1, t2] = e.touches;
      touchMode = 'pinch';
      pinchStartDist = getTouchesDistance(t1, t2);
      pinchStartZoom = typeof zoom === 'number' ? zoom : 1;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    if (touchMode === 'pinch' && e.touches.length === 2) {
      // Zoom com dois dedos
      e.preventDefault();
      if (pinchStartDist <= 0) {
        const [t1, t2] = e.touches;
        pinchStartDist = getTouchesDistance(t1, t2);
        return;
      }
      const [t1, t2] = e.touches;
      const dist = getTouchesDistance(t1, t2);
      let scale = dist / pinchStartDist;
      if (!isFinite(scale) || scale <= 0) return;

      let newZoom = pinchStartZoom * scale;
      newZoom=Math.max(window.MFAdapter?.project?.camera?.minZoom??MIN_ZOOM,newZoom);
      newZoom=Math.min(window.MFAdapter?.project?.camera?.maxZoom??MAX_ZOOM,newZoom);
      zoom = newZoom;

      if (typeof needRedraw !== 'undefined') needRedraw = true;
      return;
    }

    if ((touchMode === 'tap' || touchMode === 'pan') && e.touches.length === 1) {
      const t = e.touches[0];
      const dxTotal = t.clientX - touchStartX;
      const dyTotal = t.clientY - touchStartY;

      // Se mexeu mais que a zona de tap, vira pan
      if (touchMode === 'tap') {
        if (Math.abs(dxTotal) > TAP_MAX_MOVEMENT || Math.abs(dyTotal) > TAP_MAX_MOVEMENT) {
          touchMode = 'pan';
        } else {
          return;
        }

      e.preventDefault();

      offsetY = cameraStartY + dyTotal;

      if (typeof clampCamera === 'function') clampCamera();

      lastTouchX = t.clientX;
      lastTouchY = t.clientY;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    if (touchMode === 'tap') {
      const now = (performance && performance.now) ? performance.now() : Date.now();
      const elapsed = now - touchStartTime;
      const dx = lastTouchX - touchStartX;
      const dy = lastTouchY - touchStartY;
      const moved = Math.hypot(dx, dy);

      if (elapsed <= TAP_MAX_DURATION && moved <= TAP_MAX_MOVEMENT) {

        dispatchMouseLikeClick(lastTouchX, lastTouchY);
      }

      touchMode = null;

    }

    touchMode = null;
    pinchStartDist = 0;
  }, { passive: true });

function encontrarTerraSecaLivre() {

  const gx0 = aradora.gx, gy0 = aradora.gy;
  let best = null, bestDist = Infinity;

  for (const t of terrenos) {
    if (!t || !t.imgSrc || !t.imgSrc.includes('terra-seca')) continue;
    if (t.cultura) continue;

    if (player.acaoAtual && player.acaoAtual.tipo === 'arar' && player.acaoAtual.alvo === t) continue;

    if (t._ocupant && t._ocupant !== null) continue;

    const dy = Math.abs((t.gy || 0) - gy0);
    const d = dx + dy;
    if (d < bestDist) {

    }

function getInventorySimpleSnapshot() {
  try {
    const inv = (window.__gameInventory && window.__gameInventory.map) ? window.__gameInventory.map : {};
    const simple = {};
    for (const tipo in inv) {
      if (!Object.prototype.hasOwnProperty.call(inv, tipo)) continue;
      const item = inv[tipo] || {};
      simple[tipo] = {
        count: item.count || 0,
        imgSrc: item.imgSrc || ''
      };
    }
    return simple;
  } catch (e) {
    console.warn('getInventorySimpleSnapshot error', e);
    return {};
  }
}

function clearInventoryFromSave() {
  try {
    if (!window.__gameInventory || !Array.isArray(window.__gameInventory.slots)) return;
    const slots = window.__gameInventory.slots;
    slots.forEach(slot => {
      slot.innerHTML = '';
      slot.dataset.tipo = '';
      slot.removeAttribute('data-tipo');
    });
    if (window.__gameInventory.map) {
      for (const k in window.__gameInventory.map) {
        if (Object.prototype.hasOwnProperty.call(window.__gameInventory.map, k)) {
          delete window.__gameInventory.map[k];
        }
      }
    }
  } catch (e) {
    console.warn('clearInventoryFromSave error', e);
  }
}

function restoreInventoryFromSimple(simple) {
  try {
    if (!simple || !window.__gameInventory || !Array.isArray(window.__gameInventory.slots)) return;
    if (!window.addToInventory) return;
    clearInventoryFromSave();
    for (const tipo in simple) {
      if (!Object.prototype.hasOwnProperty.call(simple, tipo)) continue;
      const entry = simple[tipo];
      const count = entry && entry.count ? entry.count : 0;
      const imgSrc = entry && entry.imgSrc ? entry.imgSrc : '';
      if (count > 0) {
        window.addToInventory(tipo, count, imgSrc);
      }
    }
  } catch (e) {
    console.warn('restoreInventoryFromSimple error', e);
  }
}


function getTerrenosSnapshot() {
  try {
    return terrenos.map(t => {
      if (!t) return null;
      const base = {
        gx: t.gx || 0,
        gy: t.gy || 0,
        w: t.w || 1,
        h: t.h || 1,
        imgSrc: t.imgSrc || '',
        visualScale: (typeof t.visualScale === 'number') ? t.visualScale : (parseFloat(t.visualScale || '1') || 1)
      };
      if (t.cultura) {
        base.cultura = {
          tipo: t.cultura.tipo || '',
          etapa: t.cultura.etapa || 0,
          startTime: t.cultura.startTime || Date.now(),
          totalTime: t.cultura.totalTime || 0
        };
      }
      // Save animal state as well (so cloud/local saves persist timers)
      if (t.animal) {
        base.animal = {
          tipo: t.animal.tipo || '',
          etapa: (typeof t.animal.etapa === 'number') ? t.animal.etapa : 0,
          startTime: (typeof t.animal.startTime === 'number') ? t.animal.startTime : Date.now(),
          totalTime: (typeof t.animal.totalTime === 'number') ? t.animal.totalTime : (ANIMAL_ADULT && ANIMAL_ADULT[(t.animal.tipo||'').toLowerCase()] ? ANIMAL_ADULT[(t.animal.tipo||'').toLowerCase()].totalTime : 0)
        };
      }
      if(t.animal)base.animal=JSON.parse(JSON.stringify(t.animal));
      if(t.cultura)base.cultura=JSON.parse(JSON.stringify(t.cultura));
      // Save additional editable scene data; don't serialize images, timers or DOM objects.
      for(const [key,value] of Object.entries(t)){
        if(key in base || key.startsWith('_') || ['img','image','element','timer','interval','animation','path'].includes(key))continue;
        if(value===null || ['string','number','boolean'].includes(typeof value))base[key]=value;
        else if(Array.isArray(value) && value.length<100 && value.every(v=>v===null||['string','number','boolean'].includes(typeof v)))base[key]=value.slice();
      }
      return base;
    }).filter(Boolean);
  } catch (e) {
    console.warn('getTerrenosSnapshot error', e);
    return [];
  }
}




function restoreTerrenosFromSnapshot(arr) {
  try {
    terrenos = [];
    if (!Array.isArray(arr)) return;
    arr.forEach(it => {
      if (!it) return;
      const t = {
        gx: (typeof it.gx === 'number') ? it.gx : 0,
        gy: (typeof it.gy === 'number') ? it.gy : 0,
        w: (typeof it.w === 'number') ? it.w : 1,
        h: (typeof it.h === 'number') ? it.h : 1,
        imgSrc: it.imgSrc || '',
        visualScale: (typeof it.visualScale === 'number') ? it.visualScale : (parseFloat(it.visualScale || '1') || 1)
      };
      // Reapply additional simple object properties kept by the editor.
      for(const [key,value] of Object.entries(it)){
        if(key in t || ['animal','cultura'].includes(key) || key.startsWith('_'))continue;
        if(value===null || ['string','number','boolean'].includes(typeof value))t[key]=value;
        else if(Array.isArray(value)&&value.length<100&&value.every(v=>v===null||['string','number','boolean'].includes(typeof v)))t[key]=value.slice();
      }
      if (it.cultura) {
        t.cultura = {
          tipo: it.cultura.tipo || '',
          etapa: it.cultura.etapa || 0,
          startTime: it.cultura.startTime || Date.now(),
          totalTime: it.cultura.totalTime || 0
        };
        // restart growth timer if needed
        if (typeof startGrowthTimer === 'function') {
          startGrowthTimer(t);
        }
      }
      // restore animal state if present
      if (it.animal) {
        t.animal = {
          tipo: it.animal.tipo || '',
          etapa: (typeof it.animal.etapa === 'number') ? it.animal.etapa : 0,
          startTime: (typeof it.animal.startTime === 'number') ? it.animal.startTime : Date.now(),
          totalTime: (typeof it.animal.totalTime === 'number') ? it.animal.totalTime : (ANIMAL_ADULT && ANIMAL_ADULT[(it.animal.tipo||'').toLowerCase()] ? ANIMAL_ADULT[(it.animal.tipo||'').toLowerCase()].totalTime : 0)
        };
        Object.assign(t.animal,JSON.parse(JSON.stringify(it.animal)));
        // restart animal timer if needed
        if (typeof reapplyAnimalFromTime === 'function') {
          reapplyAnimalFromTime(t);
        }
      }
      terrenos.push(t);
    });
  } catch (e) {
    console.warn('restoreTerrenosFromSnapshot error', e);
    terrenos = terrenos || [];
  }
}

function saveGameState(reason) {
  window.MFHost?.changed(reason);

    const data = {
      version: 1,
      time: Date.now(),
      moedas: (typeof moedas === 'number') ? moedas : 0,

      player: (typeof player !== 'undefined' && player) ? { gx: player.gx || 0, gy: player.gy || 0 } : null,
      aradora: (typeof aradora !== 'undefined' && aradora) ? { 
        spawned: !!aradora.spawned,
        gx: aradora.gx || 0,
        gy: aradora.gy || 0
      } : null,
      aradoraWelcomeShown: !!window.__aradoraWelcomeShown,

      inventory: getInventorySimpleSnapshot()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    // console.log('AUTO-SAVE ok', reason || '');
  } catch (e) {
    console.warn('saveGameState error', e);
  }
}

      } else {

    if (typeof playerLevel === 'number') playerLevel = (typeof data.playerLevel === 'number') ? data.playerLevel : playerLevel;
    if (typeof updateXPUI === 'function') updateXPUI();
    if (typeof atualizarHudNivel === 'function') atualizarHudNivel();
    if (typeof atualizarBloqueioTerrasPorNivel === 'function') atualizarBloqueioTerrasPorNivel();

    if (Array.isArray(data.terrenos)) {
      restoreTerrenosFromSnapshot(data.terrenos);

      // Corrige culturas antigas que usavam performance.now() (startTime muito baixo),
      // para não ficarem travadas em 100% assim que o jogo é carregado.
      const agoraFix = Date.now();
      const LIMIAR_EPOCH_MS = 100000000000; // ~1973 em ms — qualquer valor abaixo disso é considerado "inválido" aqui
      if (Array.isArray(terrenos)) {
        terrenos.forEach(t => {
          if (!t || !t.cultura) return;
          const c = t.cultura || t.animal;
          if (typeof c.startTime === 'number' && c.startTime < LIMIAR_EPOCH_MS) {
            // Trata como se tivesse acabado de plantar no momento do load
            c.startTime = agoraFix;
          }
        });
      }

      // Após restaurar os terrenos, reaplica crescimento das culturas com base no tempo real
      if (typeof reapplyGrowthFromTime === 'function' && typeof terrenos !== 'undefined' && Array.isArray(terrenos)) {
        terrenos.forEach(t => {
          if (t && t.cultura) {
            reapplyGrowthFromTime(t);
          }
        });
      }
    }

    if (typeof COLS === 'number' && typeof data.COLS === 'number') COLS = data.COLS;
    if (typeof ROWS === 'number' && typeof data.ROWS === 'number') ROWS = data.ROWS;
    if (typeof offsetX === 'number' && typeof data.offsetX === 'number') offsetX = data.offsetX;
    if (typeof offsetY === 'number' && typeof data.offsetY === 'number') offsetY = data.offsetY;
    if (typeof zoom === 'number' && typeof data.zoom === 'number') zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, data.zoom));

    if (data.player && typeof player !== 'undefined' && player) {
      player.gx = (typeof data.player.gx === 'number') ? data.player.gx : player.gx;
      player.gy = (typeof data.player.gy === 'number') ? data.player.gy : player.gy;
      if (typeof gridToScreen === 'function') {
        const pStart = gridToScreen(player.gx, player.gy);
        player.x = pStart.x;
        player.y = pStart.y;
      }
    }

    if (data.aradora && typeof aradora !== 'undefined' && aradora) {
      aradora.spawned = !!data.aradora.spawned;
      aradora.gx = (typeof data.aradora.gx === 'number') ? data.aradora.gx : aradora.gx;
      aradora.gy = (typeof data.aradora.gy === 'number') ? data.aradora.gy : aradora.gy;
      if (typeof gridToScreen === 'function') {
        const aStart = gridToScreen(aradora.gx, aradora.gy);
        aradora.x = aStart.x;
        aradora.y = aStart.y;
      }
    }

    if (data.inventory) {
      restoreInventoryFromSimple(data.inventory);
    }

    if (typeof requestRedraw === 'function') requestRedraw();
  } catch (e) {
    console.warn('loadGameState error', e);
  }
}

let terrenos = []; // lista de terrenos/tiles especiais { gx, gy, w, h, imgSrc, cultura, _timers }

// wrapper para push em 'terrenos' — garante que, se um obj for animal, a propriedade animal exista e o startAnimalGrowth seja agendado
(function(){
  try {
    if (!terrenos) return;
    const _origPush = terrenos.push.bind(terrenos);
    terrenos.push = function(obj) {
      try {
        // Se o argumento não for objeto, aplicar normalmente
        if (obj && typeof obj === 'object') {
          // se obj já tem animal, normalize e agende timer
          if (obj.animal && obj.animal.tipo) {
            try {
              if (!obj.animal.etapa && obj.animal.etapa !== 0) obj.animal.etapa = obj.animal.etapa || 0;
              if (!obj.animal.startTime) obj.animal.startTime = Date.now();
              if (typeof obj.animal.totalTime !== 'number' && ANIMAL_ADULT && ANIMAL_ADULT[obj.animal.tipo]) {
                obj.animal.totalTime = ANIMAL_ADULT[obj.animal.tipo].totalTime;
              }
            } catch(e){}
          } else if (placingItem && placingItem.id) {
            // se placingItem indica animal, e obj ainda não tem animal, atribuir
            try {
              const tipo = (placingItem.id || '').replace('item-','').toLowerCase();
              if (ANIMAL_ADULT && ANIMAL_ADULT[tipo]) {
                obj.animal = obj.animal || {};
                obj.animal.tipo = obj.animal.tipo || tipo;
                obj.animal.etapa = obj.animal.etapa || 0;
                obj.animal.startTime = obj.animal.startTime || Date.now();
                obj.animal.totalTime = typeof obj.animal.totalTime === 'number' ? obj.animal.totalTime : ANIMAL_ADULT[tipo].totalTime;
                if (placingItem.imgSrc) obj.imgSrc = obj.imgSrc || placingItem.imgSrc;
              }
            } catch(e){}
          }
        }
      } catch(e){}
      const rv = _origPush(obj);
      // after push, if last terrain has animal, schedule startAnimalGrowth
      try {
        const t = terrenos[terrenos.length - 1];
        if (t && t.animal && t.animal.tipo) {
          if (!t._timers) t._timers = [];
          t._timers.forEach(id => clearTimeout(id));
          t._timers.length = 0;
          setTimeout(() => { try { startAnimalGrowth(t); } catch(e){} }, 20);
        }
      } catch(e){}
      return rv;
    };
  } catch(e){ console.warn('wrapper terrenos.push falhou:', e); }
})();

function updateTruckDomPosition() {
  if (!caminhaoVendas.spawned) return;
  if (!canvas || typeof gridToScreen !== 'function') return;
  const img = truckDomImg || ensureTruckDomImg();
  if (!img) return;

  // converte posição em tile -> coordenada de mundo
  const anchor = gridToScreen(
    caminhaoVendas.gx + (caminhaoVendas.w - 1) / 2,
    caminhaoVendas.gy + (caminhaoVendas.h - 1) / 2
  );

  const rect = canvas.getBoundingClientRect();
  const worldX = anchor.x;
  const worldY = anchor.y;

  const screenX = rect.left + (canvas.width / 2 + offsetX + worldX * zoom);
  const screenY = rect.top  + (canvas.height / 3 + offsetY + worldY * zoom);

  const pixelWidth  = TILE_W * zoom * caminhaoVendas.w;
  const pixelHeight = TILE_H * zoom * caminhaoVendas.h * 1.5;

  img.style.width  = pixelWidth + 'px';
  img.style.height = 'auto';

img.style.left = (screenX - pixelWidth / 2) + 'px';
img.style.top  = (screenY - pixelHeight + TILE_H * zoom * 0.5) + 'px';

// 👉 aplica o flip horizontal conforme o facing
const facing = (typeof caminhaoVendas.facing === 'number') ? caminhaoVendas.facing : 1;
img.style.transform = `scaleX(${facing})`;
}


function initTruck() {
  try {
    const lane = truckConfig.laneGy;

    let startGx, startGy, stopGx, stopGy;

    if (truckConfig.direction === "left") {
      // vem da direita pra esquerda (como antes)
      stopGx = COLS + truckConfig.stopGxOffsetRight;
      startGx = stopGx + truckConfig.approachTiles;
      startGy = stopGy = lane;
      caminhaoVendas.facing = 1; // supondo que o GIF olhe pra esquerda
    } else if (truckConfig.direction === "right") {
      // vem da esquerda pra direita
      stopGx = -truckConfig.stopGxOffsetRight;
      startGx = stopGx - truckConfig.approachTiles;
      startGy = stopGy = lane;
      caminhaoVendas.facing = -1; // espelha pra olhar pra direita
    } else if (truckConfig.direction === "down") {
      // vem de cima pra baixo
      stopGy = lane + truckConfig.stopGxOffsetRight;
      startGy = stopGy + truckConfig.approachTiles;
      startGx = stopGx = Math.floor(COLS / 2);
      caminhaoVendas.facing = 1; // cima/baixo, deixa normal
    } else if (truckConfig.direction === "up") {
      // vem de baixo pra cima
      stopGy = lane - truckConfig.stopGxOffsetRight;
      startGy = stopGy - truckConfig.approachTiles;
      startGx = stopGx = Math.floor(COLS / 2);
      caminhaoVendas.facing = 1;
    }

    caminhaoVendas.gx = startGx;
    caminhaoVendas.gy = startGy;
    caminhaoVendas.stopGx = stopGx;
    caminhaoVendas.stopGy = stopGy;

    const anchor = gridToScreen(
      caminhaoVendas.gx + (caminhaoVendas.w - 1) / 2,
      caminhaoVendas.gy + (caminhaoVendas.h - 1) / 2
    );
    caminhaoVendas.x = anchor.x;
    caminhaoVendas.y = anchor.y;

    caminhaoVendas.state = "moving";
    caminhaoVendas.currentSprite = truckSpriteMoving;

    try {
      const img = ensureTruckDomImg();
      if (img) {
        img.src = window.__MF_PROJECT?.truck?.movingGif || TRUCK_MOVING_SRC;
        const facing = (typeof caminhaoVendas.facing === 'number') ? caminhaoVendas.facing : 1;
        img.style.transform = `scaleX(${facing})`;
      }
    } catch (e) {
      console.warn('truck DOM src move fail', e);
    }

    caminhaoVendas.spawned = true;
    try { ensureTruckDomImg(); updateTruckDomPosition(); } catch(e) { console.warn('truck DOM init fail', e); }
  } catch (e) {
    console.warn('Falha ao inicializar caminhão de vendas:', e);
  }
}

// ---------------------------
// Utilitários de grid/isométrico
// ---------------------------
function gridToScreen(gx, gy) {
  return { x: (gx - gy) * (TILE_W / 2), y: (gx + gy) * (TILE_H / 2) };
}
function screenToGridFloat(x,y){ return {gx:(x/(TILE_W/2)+y/(TILE_H/2))/2,gy:(y/(TILE_H/2)-x/(TILE_W/2))/2}; }
function pointInDiamond(px, py, cx, cy) {
  const dx = Math.abs(px - cx) / (TILE_W/2);
  const dy = Math.abs(py - cy) / (TILE_H/2);
  return (dx + dy) <= 1.0;
}
function screenPointToTile(mx, my) {
  const f = screenToGridFloat(mx, my);
  const baseX = Math.floor(f.gx), baseY = Math.floor(f.gy);
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
    const gx = baseX + dx, gy = baseY + dy;
    if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) continue;
    const c = gridToScreen(gx, gy);
    if (pointInDiamond(mx, my, c.x, c.y)) return { gx, gy };
  }
  return { gx: baseX, gy: baseY };
}

// Terrenos / estruturas (inclui plantações, animais, cercas, etc)
function getFootBaseDepthForTerreno(t) {
  if (!t) return 0;
  // pé = centro da linha de baixo do retângulo (w x h tiles)
  const footGx = t.gx + (t.w - 1) / 2;
  const footGy = t.gy + (t.h - 1);
  return (footGx + footGy) * TILE_H;
}

// Personagens (player, aradora)
// usamos o tile onde o pé está (gx, gy), não o x,y em pixels
function getFootBaseDepthForChar(p) {
  return ((p.gx || 0) + (p.gy || 0)) * TILE_H;
}

// Camada de altura para terrenos (plantas, animais, etc.)
function getHeightLayerForTerreno(t) {
  if (!t) return 0;

  // 🐷 Animais: porco
  if (t.imgSrc) {
    const src = String(t.imgSrc).toLowerCase();
    if (src.includes('porquinho','vaca') || src.includes('porco','vaca','porquinho')) {
      return 10; // animal médio

  }

  // 🌾 Culturas
  if (t.cultura) {
    const tipo = String(t.cultura.tipo || '').toLowerCase();
    const etapa = t.cultura.etapa | 0;

    if (etapa === 2) {
      // muito altos
      if (tipo === 'milho' || tipo === 'cafe' || tipo === 'abacaxi') return 2;
      // médios
      if (
        tipo === 'trigo' ||
        tipo === 'melancia' ||
        tipo === 'morango' ||
        tipo === 'beterraba' ||
        tipo === 'cenoura'
      ) return 1;
    }
  }

  // chão / coisas baixinhas
  return 0;
}

}

// Profundidade baseada na posição REAL do personagem (entre tiles)
function getCharacterDepth(p) {
  // Usa a posição em pixels do personagem pra descobrir o "tile flutuante"
  const pf = screenToGridFloat(p.x, p.y);
  const gx = pf.gx;
  const gy = pf.gy;
  return (gx + gy) * TILE_H;
}

// Define a camada de altura de cada terreno / estrutura
function getTerrainHeightLayer(t) {
  // 0 = chão
  // 1 = objetos médios (animais, cercas, culturas médias)
  // 2 = bem altos (milho grande, café, prédios altos no futuro, etc.)

  // Cultura plantada
  if (t.cultura) {
    const tipo = ('' + t.cultura.tipo).toLowerCase();
    const etapa = t.cultura.etapa | 0;

    // bem altos
    if ((tipo === 'milho' || tipo === 'cafe' || tipo === 'abacaxi') && etapa === 2) {
      return 2;
    }

    // médios
    if ((tipo === 'trigo' || tipo === 'melancia' || tipo === 'morango') && etapa === 2) {
      return 1;
    }
  }

  // Animais (por enquanto só o porco, mas dá pra ir adicionando por sprite)
  if (t.imgSrc) {
    const src = t.imgSrc.toLowerCase();
    if (src.includes('porquinho') || src.includes('porco')) {
      return 1; // animal médio
    }
  }

  // default: chão
  return 0;
}

// Cancelar seleção ao clicar FORA da área válida (depois do spawn)
// ==================================================
window.addEventListener('click', e => {
  // espera um tick pra deixar o clique do spawn terminar primeiro
  setTimeout(() => {
    if (!continuousSelection || !selectedItem) return;

    // converte clique pra coordenadas do mapa
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left - canvas.width / 2 - offsetX) / zoom;
    const my = (e.clientY - rect.top - canvas.height / 3 - offsetY) / zoom;
    const tile = screenPointToTile(mx, my);

    // verifica se tem terreno naquela posição
    const terreno = findTerrainAt(tile?.gx, tile?.gy);

    // se não tem terreno e não clicou em botões/menus → cancela
    const clickedUI = e.target.closest('#overlay-loja, #overlay-bau, #btn-loja, #btn-bau');
    if (!terreno && !clickedUI) {
      continuousSelection = false;
      selectedItem = null;
      preview.active = false;
      placingItem = null;
      modoColocar = null;
      document.querySelectorAll('.card-item').forEach(c => c.style.outline = '');
      canvas.style.cursor = 'default';
    }
  }, 50); // espera 50ms pra não interceptar o clique do spawn
});

// Função que inicia o temporizador de crescimento de um animal num terreno
function startAnimalGrowth(terreno) {
  if (!terreno) return;
  if (!terreno._timers) terreno._timers = [];
  const a = terreno.animal;
  if (!a || !a.tipo) return;

  const cfg = ANIMAL_ADULT[(a.tipo || '').toLowerCase()];
  if (!cfg) return;

  a.etapa = a.etapa || 0;
  a.startTime = a.startTime || Date.now();
  a.totalTime = typeof a.totalTime === 'number' ? a.totalTime : cfg.totalTime;

  if (!window.imgCache) window.imgCache = {};
  if (!imgCache[cfg.adultImg]) { const im = new Image(); im.src = cfg.adultImg; imgCache[cfg.adultImg] = im; }

  const restante = Math.max(0, a.totalTime - (Date.now() - a.startTime));
  const mfItemCfg=window.MFAdapter?.project?.items?.['item-'+String(a.tipo).toLowerCase()];
  if(mfItemCfg?.animalStage1){
   const mid=Math.max(0,a.totalTime*Math.max(.05,Math.min(.95,Number(mfItemCfg.animalMiddleRatio??.5)))-(Date.now()-a.startTime));
   if(mid<restante){const mt=setTimeout(()=>{if(terreno.animal===a&&a.etapa<2){a.etapa=1;terreno.imgSrc=mfItemCfg.animalStage1;preload(terreno.imgSrc);requestRedraw()}},mid);terreno._timers.push(mt)}
  }
  const t = setTimeout(() => {
    if (terreno && terreno.animal && terreno.animal.tipo === a.tipo) {
      terreno.animal.etapa = 2;
      terreno.imgSrc = cfg.adultImg;
      if (!imgCache[terreno.imgSrc]) {
        const im = new Image();
        im.src = terreno.imgSrc;
        imgCache[terreno.imgSrc] = im;
      }

      // Se for vaca, tenta iniciar o loop de leite (caso o módulo já tenha sido carregado)
      try {
        setTimeout(() => {
          try {
            if (
              terreno &&
              terreno.animal &&
              String(terreno.animal.tipo || '').toLowerCase() === 'vaca'
            ) {
              if (window.__VacaMilk && typeof window.__VacaMilk.startVacaMilkLoop === 'function') {
                window.__VacaMilk.startVacaMilkLoop(terreno);
              }
            }
          } catch(e) { /* noop inner */ }
        }, 50);
      } catch (e) {
        /* noop */
      }
    }
  }, restante);
  terreno._timers.push(t);
}

// Reaplica timer ao carregar (caso tenha terrenos com .animal)
function reapplyAnimalFromTime(terreno) {
  if (!terreno || !terreno.animal) return;
  const a = terreno.animal;
  const cfg = ANIMAL_ADULT[(a.tipo||'').toLowerCase()];
  if (!cfg) return;
  // se já adulto, garante sprite
  const elapsed = Date.now() - (a.startTime || Date.now());
  if (elapsed >= a.totalTime) {
    terreno.animal.etapa = 2;
    terreno.imgSrc = cfg.adultImg;
  } else {
    // reinicia timer com restante
    startAnimalGrowth(terreno);
  }
} // <<-- atenção: função fechada aqui

 if (terreno.animal.milk.progress >= 100) {

/* Crescimento centralizado: 8 culturas, sem dezenas de temporizadores redundantes. */
const CROP_STAGE_TABLE={milho:MILHO_ETAPAS,cenoura:CENOURA_ETAPAS,morango:MORANGO_ETAPAS,trigo:TRIGO_ETAPAS,beterraba:BETERRABA_ETAPAS,melancia:MELANCIA_ETAPAS,abacaxi:ABACAXI_ETAPAS,cafe:CAFE_ETAPAS};
const CROP_TIME_TABLE={milho:20000,cenoura:40000,morango:75000,trigo:25000,beterraba:35000,melancia:55000,abacaxi:55000,cafe:145000};
const CROP_FIRST_RATIO={milho:.25,cenoura:.375,morango:35/75,trigo:.4,beterraba:10/35,melancia:20/55,abacaxi:20/55,cafe:60/145};
function startGrowthTimer(t){reapplyGrowthFromTime(t)}
function reapplyGrowthFromTime(t){
 if(!t||!t.cultura)return;
 const crop=t.cultura,type=String(crop.tipo||'').toLowerCase(),stages=CROP_STAGE_TABLE[type];if(!stages)return;
 if(!Array.isArray(t._timers))t._timers=[];
 for(const id of t._timers)clearTimeout(id);t._timers.length=0;
 const settings=window.MFAdapter?.project?.items?.['item-'+type]||{};
 const total=Math.max(100,Number(settings.growTime)||Number(crop.totalTime)||CROP_TIME_TABLE[type]||20000);
 crop.totalTime=total;
 if(!crop.startTime||crop.startTime<1e11)crop.startTime=Date.now();
 const first=Math.round(total*(CROP_FIRST_RATIO[type]||.35));
 function sync(){
  if(t.cultura!==crop)return;
  const elapsed=Math.max(0,Date.now()-crop.startTime);
  const stage=elapsed>=total?2:elapsed>=first?1:0;
  if(crop.etapa!==stage||t.imgSrc!==stages[stage]){crop.etapa=stage;t.imgSrc=stages[stage];preload(stages[stage]);requestRedraw()}
 }
 sync();const elapsed=Date.now()-crop.startTime;
 if(elapsed<first)t._timers.push(setTimeout(sync,Math.max(0,first-elapsed)));
 if(elapsed<total)t._timers.push(setTimeout(sync,Math.max(0,total-elapsed)));
}

// Colheita (retorna terra-arada, dá XP) — mantém spawnLoot (drop animado)
function tryHarvestAtTile(tile) {
  if (!tile || !tile.cultura) return false;
  const tipo = ('' + tile.cultura.tipo).toLowerCase();

  const pos = gridToScreen(tile.gx, tile.gy);
  const screenX = canvas.width / 2 + offsetX + pos.x * zoom;
  const screenY = canvas.height / 3 + offsetY + pos.y * zoom;
  if (tile.cultura.etapa === 2) window.MFValueSource?.tile(tile, "colheita");

  if (tipo === 'milho' && tile.cultura.etapa === 2) {
    spawnLoot('milho', screenX, screenY);
    tile.cultura = null;
    tile.imgSrc = TERRA_ARADA_SRC;
    addXP(window.MFAdapter?.project?.items?.['item-'+tipo]?.harvestXP ?? 225);
    return true;
  }
  if (tipo === 'cenoura' && tile.cultura.etapa === 2) {
    spawnLoot('cenoura', screenX, screenY);

function encontrarTerraSecaLivre() {
  if (!Array.isArray(terrenos) || typeof aradora === 'undefined') return null;
  const gx0 = aradora.gx, gy0 = aradora.gy;
  let best = null, bestDist = Infinity;

  for (const t of terrenos) {
    if (!t || !t.imgSrc || !t.imgSrc.includes('terra-seca')) continue;
    if (t.cultura) continue;

    // 🔒 já está reservada por alguém
    if (t._ocupant && t._ocupant !== 'aradora') continue;

    // 🔒 player já está indo/arándo nela
    if (player.acaoAtual && player.acaoAtual.tipo === 'arar' && player.acaoAtual.alvo === t) continue;

    // 🔒 terreno na fila do player
    if (Array.isArray(filaAcoes) && filaAcoes.includes(t)) continue;

    // 🔒 outra aradora pode ter reservado
    if (t._ocupant && t._ocupant !== null) continue;

    const dx = Math.abs((t.gx || 0) - gx0);
    const dy = Math.abs((t.gy || 0) - gy0);
    const d = dx + dy;
    if (d < bestDist) {
      bestDist = d;
      best = t;
    }
  }
  return best;
}
function processAradora() {
  if (typeof aradora === 'undefined') return;

  // 🧹 Remove da fila terrenos que não existem mais
  if (Array.isArray(aradora.fila)) {

  spawnedTiles.add(key);

(function() {

    '#overlay-loja',
    '#btn-loja',

    if (!target || !target.closest) return false;
    for (const sel of ignoreSelectors) {

    return false;

    // se clicou dentro do canvas
    if (target.closest && target.closest('canvas')) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left - canvas.width / 2 - offsetX) / zoom;
      const my = (e.clientY - rect.top - canvas.height / 3 - offsetY) / zoom;
      const tile = screenPointToTile(mx, my);

        modoTrator = false;
        canvas.style.cursor = 'default';
        if (overlayTrator) overlayTrator.style.display = 'none';

      // se existe terreno, o handler do canvas trata o overlay normalmente
      return;

    // se clicou fora do canvas (qualquer parte da tela que não seja UI)
    modoTrator = false;
    canvas.style.cursor = 'default';
    if (overlayTrator) overlayTrator.style.display = 'none';

// UPADOR DE NIVEL POR XP / UPADOR DE LEVEL POR XP///

function xpForNext(level) {
 const r=window.MFAdapter?.project?.progression;
 if(r&&r.mode!=='classic'){
   const base=Math.max(1,Number(r.baseXP)||1000),per=Math.max(0,Number(r.perLevel)||4100);
   return Math.max(1,Math.round(r.mode==='exponential'?base*Math.pow(Math.max(1,Number(r.growthMultiplier)||1.18),Math.max(0,level-1)):base+per*Math.max(0,level-1)));
 }
  if (level === 1) return 1000; // XP necessário para sair do nível 1

  if (level <= 50) {
    // Do nível 1 ao 4 → +2550 por nível
    // Do nível 5 ao 50 → +4100 por nível
    const aumento = level < 5 ? 2550 : 4100;
    const niveisAntes = level - 1;

    // Soma incremental: 1000 + (níveis antes de 5 * 2550) + (níveis após 4 * 4100)
    const xp =
      1000 +
      Math.min(niveisAntes, 4) * 2550 +
      Math.max(0, niveisAntes - 4) * 4100;

    return xp;
  } else {
    // A partir do nível 51: sistema exponencial por blocos de 50
    const base50 = 1000 + (4 * 2550) + (46 * 4100); // XP total acumulado até nível 50
    const bloco = Math.floor((level - 1) / 50);
    const incrementoBase = 2400 * Math.pow(2, bloco - 1); // dobrando a base a cada bloco de 50 níveis
    const dentroDoBloco = (level - 1) % 50;
    return base50 + dentroDoBloco * incrementoBase;
  }
}

function addXP(amount) {
  if (!amount || amount <= 0) return;
  playerXP += amount;
  updateXPUI();
  while (playerXP >= xpForNext(playerLevel)) {
    playerXP -= xpForNext(playerLevel);
    playerLevel += 1;
    const pr=window.MFAdapter?.project?.progression||{};
    const bloco25 = Math.floor((playerLevel - 1) / Math.max(1,Number(pr.rewardBlockSize)||25));
    const baseReward = Math.max(0,Number(pr.rewardBase??30)) * Math.pow(Math.max(1,Number(pr.rewardMultiplier)||2), bloco25);
    const nivelCiclo = (playerLevel - 1) % Math.max(1,Number(pr.rewardCycleSize)||5);
    const reward = Math.round(baseReward * Math.pow(Math.max(1,Number(pr.rewardCycleMultiplier)||2), nivelCiclo));
    window.MFValueSource?.actor("player", "nivel");
    moedas += reward;
    console.log(`Nível ${playerLevel} → +${reward} moedas (base ${baseReward})`);
    if (moedasSpan) moedasSpan.textContent = moedas;
    console.log('LEVEL UP ->', playerLevel, 'reward:', reward);
  }
  updateXPUI();
}

function updateXPUI() {
  const bar = document.getElementById('hud-xp-fill');
  const text = document.getElementById('hud-xp-text');
  const lvl = document.getElementById('hud-xp-level');
  if (!bar || !text || !lvl) return;

  const need = xpForNext(playerLevel);
  const pct = Math.max(0, Math.min(100, Math.floor((playerXP / need) * 100)));

  // --- animação suave da barra ---
  const currentWidth = parseFloat(bar.style.width) || 0;
  const targetWidth = pct;
  const duration = 600; // duração da animação em milissegundos
  const startTime = performance.now();

  function animate(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // easing cúbico suave
    const interpolated = currentWidth + (targetWidth - currentWidth) * eased;
    bar.style.width = interpolated + "%";
    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }

  requestAnimationFrame(animate);

  // Atualiza os textos normalmente
  text.textContent = `${playerXP}/${need}`;
  lvl.textContent = `LVL ${playerLevel}`;
}

const lootParticles = []; // { tipo, img, x, y, screenX, screenY, time, duration }
function spawnLoot(tipo, screenX, screenY) {
  const imgSrc = LOOT_SPRITES[tipo] || window.MFAdapter?.project?.items?.['item-'+tipo]?.lootIcon;
  const img = imgSrc ? preload(imgSrc) : null;
  lootParticles.push({
    tipo: tipo,
    img: img,
    x: screenX,
    y: screenY,
    screenX: screenX,
    screenY: screenY,
    time: 0,
    duration: 1600 // ms
  });
}
function updateLoots(dt) {
  if (!dt) return;
  for (let i = lootParticles.length - 1; i >= 0; i--) {
    const p = lootParticles[i];
    p.time += dt;
    const t = Math.min(1, p.time / p.duration);
    const floatY = Math.sin(t * Math.PI) * 30;
    const btnBau = document.getElementById('btn-bau');
    const rect = btnBau ? btnBau.getBoundingClientRect() : { left: 40, top: 40, width: 64, height: 64 };
    const targetX = rect.left + rect.width / 2;
    const targetY = rect.top + rect.height / 2;
    const ease = t * t;
    p.screenX = p.x + (targetX - p.x) * ease;
    p.screenY = p.y - floatY + (targetY - p.y) * ease;
    if (t >= 1) {
      try {
        const tipo = p.tipo;
        const imgSrc = LOOT_SPRITES[tipo] || window.MFAdapter?.project?.items?.['item-'+tipo]?.lootIcon || '';
        const quantidadePorTipo = {
  milho: 6,
  cenoura: 5,
  morango: 3,
  trigo: 6,
  beterraba: 4
};
        const amount = quantidadePorTipo[tipo] || 1;
        if (window.addToInventory) window.addToInventory(tipo, amount, imgSrc);
      } catch (err) {
        console.error(err);
      }
      lootParticles.splice(i, 1);
    }
  }
}
function drawLoots() {
  if (!ctx) return;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  for (let i = 0; i < lootParticles.length; i++) {
    const p = lootParticles[i];
    const fadeFactor = 2.5;
    const alpha = 1 - Math.min(1, (p.time / p.duration) / fadeFactor);
    ctx.globalAlpha = alpha;
    const size = 40;
    if (p.img && p.img.complete) {
      const width = 40;
      const height = 55;
      ctx.drawImage(p.img, p.screenX - width/2, p.screenY - height/2, width, height);
    } else {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.arc(p.screenX, p.screenY, 10, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

  const nivelCiclo = (lvl - 1) % 5;

function findPath(sx, sy, tx, ty) {
  const path = [];
  let x = sx, y = sy;
  tx = Math.max(0, Math.min(COLS - 1, tx));
  ty = Math.max(0, Math.min(ROWS - 1, ty));
  while (x !== tx || y !== ty) {
    if (x < tx) x++; else if (x > tx) x--;
    if (y < ty) y++; else if (y > ty) y--;
    path.push({ x, y });
  }
  return path;
}
function findTerrainAt(gx, gy) {
  for (let i = 0; i < terrenos.length; i++) {
    const t = terrenos[i];
    if (gx >= t.gx && gx < t.gx + (t.w || 1) && gy >= t.gy && gy < t.gy + (t.h || 1)) return t;
  }
  return null;
}

    refresh: updatePage,
    getPage: () => currentPage
  };

  // Aplica seleção padrão quando overlay-loja for exibido

<script>
// ==================== SISTEMA DE PEDIDOS DO CAMINHÃO ====================

// Tipos possíveis para o caminhão pedir
const TIPOS_CAMINHAO_POSSIVEIS = ['leite','cenoura','milho','beterraba','trigo','morango','melancia','abacaxi','cafe'];

// Estado do pedido atual
window.truckOrder = null;

// Ajuda a pegar um "preço base" pelo card da loja
function precoBaseDoTipo(tipo) {
  const tipoNorm = (tipo || '').toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, '');

  let shopCard = document.querySelector(`[id="item-${tipoNorm}"][data-preco]`);
  if (!shopCard)
    shopCard = document.querySelector(`[id*="${tipoNorm}"][data-preco]`);

  let price = 0;
  if (shopCard && shopCard.dataset && shopCard.dataset.preco) {
    price = parseFloat(shopCard.dataset.preco) || 0;
  }

  const defaults = {
    milho: 60,
    cenoura: 95,
    morango: 150,
    trigo: 55,
    beterraba: 75
  };
  if (!price && defaults[tipoNorm]) price = defaults[tipoNorm];

  return price || 10;
}

// Calcula recompensa total do pedido
function calcularRecompensaPedido(pedidos) {
  let total = 0;
  pedidos.forEach(p => {
    const preco = precoBaseDoTipo(p.tipo);
    // Ex.: 50% do preço de compra * quantidade
    total += Math.round(preco * 0.5 * p.qtd);
  });
  return total;
}
function gerarPedidoCaminhao() {
  const tipos = [...TIPOS_CAMINHAO_POSSIVEIS];
  tipos.sort(() => Math.random() - 0.5);
  const escolhidos = tipos.slice(0, 3);

  const pedidos = escolhidos.map(tipo => {
    const qtd = Math.floor(Math.random() * 6) + 3; // 3 a 8 unidades
    const lootSrc = (window.LOOT_SPRITES && window.LOOT_SPRITES[tipo]) || '';
    const lojaImg = document.querySelector(`#item-${tipo} img`);
    const imgSrc = lootSrc || (lojaImg ? lojaImg.src : '');
    return {
      tipo,
      qtd,
      entregue: 0,
      imgSrc
    };
  });

  // 🔹 Recompensa base do pedido (a que você já tinha)
  const recompensaBase = calcularRecompensaPedido(pedidos);

  // 🔹 Bônus aleatório entre 200 e 500
  const bonusExtra = Math.floor(Math.random() * 301) + 200; // 0–300 => 200–500

  // 🔹 Total que o jogador vai ver e receber
  const recompensaTotal = recompensaBase + bonusExtra;

  window.truckOrder = {
    pedidos,
    recompensaBase,   // só pra referência, se precisar
    bonusExtra,       // idem
    recompensa: recompensaTotal, // valor mostrado e pago
    completo: false,
    aberto: false
  };

}

// Atualiza a UI do overlay do caminhão
function atualizarUIOverlayCaminhao() {
  const overlay = document.getElementById('overlay-caminhao');
  const lista = document.getElementById('caminhao-pedidos');
  const recompensaEl = document.getElementById('caminhao-recompensa');
  const btnAceitar = document.getElementById('btn-aceitar-caminhao');

  if (!overlay || !lista || !recompensaEl || !btnAceitar) return;
  const order = window.truckOrder;
  if (!order) return;

  lista.innerHTML = '';

  let tudoCompleto = true;

  order.pedidos.forEach(p => {
    const linha = document.createElement('div');
    linha.className = 'pedido-linha';
    linha.dataset.tipo = p.tipo;

    const img = document.createElement('img');
    if (p.imgSrc) img.src = p.imgSrc;

    const textoWrap = document.createElement('div');
    textoWrap.className = 'pedido-texto';

    const nomeBonito = p.tipo.charAt(0).toUpperCase() + p.tipo.slice(1);
    const txtPrincipal = document.createElement('div');
    txtPrincipal.textContent = `${p.qtd}x ${nomeBonito}`;

    const prog = document.createElement('div');
    prog.className = 'progresso';
    prog.textContent = `${p.entregue}/${p.qtd} entregues`;

    textoWrap.appendChild(txtPrincipal);
    textoWrap.appendChild(prog);

    linha.appendChild(img);
    linha.appendChild(textoWrap);

    if (p.entregue >= p.qtd) {
      linha.classList.add('completo');
    } else {
      tudoCompleto = false;

      // 🔹 opcional: clicar no pedido tenta entregar a partir do baú
      linha.style.cursor = 'pointer';
      linha.addEventListener('click', () => {
        try {
          if (!window.__gameInventory || !Array.isArray(window.__gameInventory.slots)) return;
          const slots = window.__gameInventory.slots;

          for (let i = 0; i < slots.length; i++) {
            const slotEl = slots[i];
            if (slotEl.dataset && slotEl.dataset.tipo === p.tipo) {
              if (typeof tentarEntregarDoSlot === 'function') {
                tentarEntregarDoSlot(slotEl);
              }
              break;
            }
          }
        } catch (e) {
          console.warn('Erro ao tentar entregar item via clique no pedido:', e);
        }
      });
    }

    lista.appendChild(linha);
  });

  // 🔹 aqui já mostra base + bônus, num valor só
recompensaEl.textContent = `${order.recompensa} moedas`;

  order.completo = tudoCompleto;

  if (tudoCompleto) {
    btnAceitar.style.opacity = '1';
    btnAceitar.style.cursor = 'pointer';
  } else {
    btnAceitar.style.opacity = '0.6';
    btnAceitar.style.cursor = 'not-allowed';
  }
}


// Abre o overlay do caminhão
function abrirOverlayCaminhao() {
  const overlay = document.getElementById('overlay-caminhao');
  if (!overlay) return;

  if (!window.truckOrder) {
    gerarPedidoCaminhao();
  }

  window.truckOrder.aberto = true;
  overlay.style.display = 'flex';
  atualizarUIOverlayCaminhao();
}
// Tenta enviar itens de um slot do baú para o pedido do caminhão
function tentarEntregarDoSlot(slotEl) {
  if (!slotEl || !window.truckOrder || !window.truckOrder.aberto) return;

  const tipo = slotEl.dataset.tipo;
  if (!tipo) return;

  const order = window.truckOrder;
  const pedido = order.pedidos.find(p => p.tipo === tipo);
  if (!pedido) return;

  let falta = pedido.qtd - pedido.entregue;
  if (falta <= 0) return;

  const inv = window.__gameInventory && window.__gameInventory.map;
  const slots = window.__gameInventory && window.__gameInventory.slots;
  if (!slots) return;

  // 🔹 Tenta achar o "slot real" via map (se existir)
  let entry = inv && inv[tipo] ? inv[tipo] : null;
  let realSlot = slotEl;

  if (entry && typeof entry.slotIndex === 'number' && slots[entry.slotIndex]) {
    realSlot = slots[entry.slotIndex];
  } else {
    // Se não tiver entry, vamos criar um depois usando esse slot
  }

  // 🔹 Quantidade que o slot realmente tem (confia no que está no slot)
  let disponivel = 0;
  const datasetCount = parseInt(realSlot.dataset.count || '0', 10);
  if (!isNaN(datasetCount)) disponivel = datasetCount;

  // Se o map tiver um valor diferente, sincroniza com o visual
  if (entry) {
    if (typeof entry.count !== 'number' || entry.count !== disponivel) {
      entry.count = disponivel;
    }
  } else if (disponivel > 0 && inv) {
    // Não tinha entry, mas o slot tem item → cria entry novo
    const idx = slots.indexOf(realSlot);
    inv[tipo] = { count: disponivel, slotIndex: idx >= 0 ? idx : 0, imgSrc: '' };
    entry = inv[tipo];
  }

  if (disponivel <= 0) return;

  // 🔹 Quanto vamos realmente transferir
  const transferir = Math.min(falta, disponivel);
  if (transferir <= 0) return;

  const novoCount = disponivel - transferir;

  // 🔹 Atualiza map (se existir)
  if (entry) {
    entry.count = novoCount;
    if (novoCount <= 0) {
      delete inv[tipo];
    }
  }

  // 🔹 Descobre a imagem pra redesenhar o slot
  let imgSrc = (entry && entry.imgSrc) || '';
  if (!imgSrc) {
    const imgEl = realSlot.querySelector('img');
    if (imgEl) imgSrc = imgEl.src;
  }

  // 🔹 Atualiza visual do slot e dataset.count
  if (novoCount <= 0) {
    if (typeof renderSlot === 'function') {
      renderSlot(realSlot, null, 0, '');
    } else {
      realSlot.innerHTML = '';
      realSlot.dataset.tipo = '';
      realSlot.dataset.count = '0';
      realSlot.removeAttribute('data-tipo');
    }
  } else {
    if (typeof renderSlot === 'function') {
      renderSlot(realSlot, tipo, novoCount, imgSrc || '');
    }
    realSlot.dataset.count = String(novoCount);
  }

  // 🔹 Atualiza entrega do caminhão
  pedido.entregue += transferir;
  if (pedido.entregue > pedido.qtd) pedido.entregue = pedido.qtd;

  // Atualiza UI do overlay do caminhão
  atualizarUIOverlayCaminhao();
}

// Finaliza o pedido, dá as moedas e some com o caminhão
function finalizarPedidoCaminhao() {
  const order = window.truckOrder;
  if (!order || !order.completo) return;

  // 🔹 agora o ganho já é base + bônus, vindo de gerarPedidoCaminhao()
  const ganho = order.recompensa || 0;

  const moedasSpanEl = document.getElementById('valor-moedas');
  let totalAtual = (typeof window.moedas === 'number' && !isNaN(window.moedas))
    ? window.moedas
    : 0;

  if ((!totalAtual || totalAtual <= 0) && moedasSpanEl) {
    const texto = moedasSpanEl.textContent || '';
    const parsed = parseInt(texto.replace(/\D+/g, ''), 10);
    if (!isNaN(parsed)) totalAtual = parsed;
  }

  window.MFValueSource?.element(document.getElementById("caminhao-content") || document.getElementById("overlay-caminhao"), "caminhao");
  totalAtual += ganho;
  window.moedas = totalAtual;
  if (typeof moedas !== 'undefined') moedas = totalAtual;
  if (moedasSpanEl) moedasSpanEl.textContent = totalAtual;

  // Fecha overlays e limpa pedido
  if (typeof fecharTodasOverlays === 'function') {
    fecharTodasOverlays();
  } else {
    const overlay = document.getElementById('overlay-caminhao');
    if (overlay) overlay.style.display = 'none';
  }

  if (window.truckOrder) window.truckOrder = null;

  // 🔹 Faz o caminhão "sumir" de fato
  if (typeof caminhaoVendas !== 'undefined') {
    caminhaoVendas.spawned = false;
    caminhaoVendas.state = 'idle';
  }

  // 🔹 AQUI estava o bug: era window.truckDomImg
  if (truckDomImg) {
    truckDomImg.style.display = 'none';
  }

  // Re-spawn persistido no save da conta.
  window.__mfTruckDue=Date.now()+120000;
  setTimeout(() => {
    try {
      if (truckDomImg) truckDomImg.style.display = '';
      window.__mfTruckDue=0;
      gerarPedidoCaminhao();
      initTruck();
    } catch (e) {
      console.warn('Erro ao respawnar caminhão:', e);
    }
  }, 120000);
}


// Liga o botão "aceitar" do caminhão
document.addEventListener('DOMContentLoaded', () => {
  const overlayCaminhao = document.getElementById('overlay-caminhao');
  if (overlayCaminhao) {
    overlayCaminhao.addEventListener('click', e => {
      if (e.target === overlayCaminhao) {
        overlayCaminhao.style.display = 'none';
        if (window.truckOrder) window.truckOrder.aberto = false;
      }
    });
  }

  const btnAceitar = document.getElementById('btn-aceitar-caminhao');
  if (btnAceitar) {
    btnAceitar.addEventListener('click', () => {
      if (!window.truckOrder || !window.truckOrder.completo) return;
      finalizarPedidoCaminhao();
    });
  }
});
</script>

    layer.appendChild(host);
    const rise = Number(cfg.rise) || 72;
    const scale = Number(cfg.scale) || 1;
    host.style.transform = `translate(-50%,-50%) scale(${scale})`;
    requestAnimationFrame(function(){
      host.style.transition = `transform ${Number(cfg.duration)||1150}ms cubic-bezier(.18,.76,.21,.99), opacity ${Number(cfg.duration)||1150}ms ease`;
      host.style.transform = `translate(-50%, calc(-50% - ${rise}px)) scale(${scale})`;
      host.style.opacity = '0';
    });
    setTimeout(function(){ host.remove(); }, (Number(cfg.duration) || 1150) + 120);
  }
  function flushPending(){
    flushTimer = null;
    if (!pendingCoins && !pendingXP) return;
    // Se nenhuma ação confiável foi identificada, usa a localização do personagem, nunca um clique aleatório.
    const anchor = pendingAnchor || toViewportActor("player") || {x: window.innerWidth/2,y:window.innerHeight/2};
    spawnFeedback(pendingCoins, pendingXP, anchor);
    pendingAnchor = null;
    pendingCoins = 0; pendingXP = 0;
  }
  function schedule(){
    if (flushTimer) return;
    flushTimer = setTimeout(flushPending, Math.max(10, Number(getCfg().combineWindow) || 120));
  }

  window.spawnMFValueFeedback = function(opts){
    const coins = Number(opts?.coins) || 0;
    const xp = Number(opts?.xp) || 0;
    const anchor = opts?.anchor || toViewportActor("player") || {x:window.innerWidth/2,y:window.innerHeight/2};
    spawnFeedback(coins, xp, anchor);
  };

  setInterval(function(){
    const c = currentCoins();
    const x = currentXP();
    if(c !== prevCoins || x !== prevXP){
      const source = activeSource && performance.now()-activeSource.at<650 ? activeSource : null;
      if(source && source.serial !== lastHandledSourceSerial){
        // Evita misturar duas ações consecutivas em pontos diferentes.
        if(pendingAnchor && (Math.hypot(pendingAnchor.x-source.anchor.x,pendingAnchor.y-source.anchor.y)>45)) flushPending();
        pendingAnchor=source.anchor;
        lastHandledSourceSerial=source.serial;
      } else if(!pendingAnchor) pendingAnchor=toViewportActor('player');
    }
    if (c !== prevCoins) { pendingCoins += (c - prevCoins); prevCoins = c; schedule(); }
    if (x !== prevXP) { pendingXP += (x - prevXP); prevXP = x; schedule(); }
  }, 70);
})();
</script>
