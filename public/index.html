<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Fazenda Online</title><link rel="stylesheet" href="online.css?v=friends-v3"></head>
<body>
<main id="gate"><section class="card"><div class="badge">🌱 MINI FAZENDA ONLINE</div><h1>Sua fazenda,<br>sua história.</h1><p>Entre com sua conta Google para cuidar da fazenda e visitar seus vizinhos.</p><button id="login" disabled>Entrar com Google</button><p id="message" role="status">Preparando conexão…</p></section></main>
<nav id="toolbar" aria-label="Ações da fazenda" hidden>
  <span id="farm-title" hidden>Minha fazenda</span><span id="sync" hidden>Online</span>
  <button id="neighbors" class="image-button" type="button" aria-label="Amigos — visitar fazendas" title="Amigos"><img src="assets/online-friends.png" alt="Amigos" draggable="false"></button>
  <button id="home" class="image-button" type="button" aria-label="Voltar à minha fazenda" title="Voltar à minha fazenda" hidden><img src="assets/online-home.png" alt="Voltar à minha fazenda" draggable="false"></button>
  <button id="logout" type="button">Sair</button>
</nav>
<div id="game-container"></div>
<dialog id="farms"><form method="dialog"><h2>Fazendas da comunidade</h2><button class="close" aria-label="Fechar">×</button></form><p>Visite para conhecer. Compras e alterações ficam desativadas.</p><div id="farm-list"></div><button id="more" hidden>Carregar mais</button></dialog>
<script src="firebase-config.js"></script><script type="module" src="online.js?v=account-v2"></script>
</body></html>
