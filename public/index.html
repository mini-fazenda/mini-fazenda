<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mini Fazenda Online</title><link rel="stylesheet" href="online.css?v=amigos-3"></head>
<body>
<main id="gate"><section class="card" id="login-card"><div class="badge" id="login-brand">🌱 MINI FAZENDA ONLINE</div><h1 id="login-title">Sua fazenda,<br>sua história.</h1><p id="login-description">Entre com sua conta Google para cuidar da fazenda e visitar seus vizinhos.</p><button id="login" disabled>Entrar com Google</button><p id="message" role="status">Preparando conexão…</p></section></main>
<nav id="toolbar" aria-label="Ações da fazenda" hidden>
  <span id="farm-title" hidden>Minha fazenda</span><span id="sync" hidden>Online</span>
  <button id="neighbors" class="image-button" type="button" aria-label="Amigos — visitar fazendas" title="Amigos"><img src="assets/online-friends.png" alt="Amigos" draggable="false"></button>
  <button id="home" class="image-button" type="button" aria-label="Voltar à minha fazenda" title="Voltar à minha fazenda" hidden><img src="assets/online-home.png" alt="Voltar à minha fazenda" draggable="false"></button>
  <button id="logout" type="button">Sair</button>
</nav>
<div id="game-container"></div>
<div id="mf-rotate-warning" role="status" aria-live="polite">↻ Gire o celular para jogar na horizontal</div>
<dialog id="farms"><section id="friends-content"><form method="dialog"><h2 id="friends-title">Fazendas da comunidade</h2><button id="friends-close" class="close" aria-label="Fechar">×</button></form><p id="friends-description">Visite para conhecer. Compras e alterações ficam desativadas.</p><div id="farm-list"></div><button id="more" hidden>Carregar mais</button></section></dialog>
<script src="online-ui.js?v=caminhao-1"></script><script src="firebase-config.js"></script><script type="module" src="online.js?v=credito-986568-1"></script>
</body></html>
