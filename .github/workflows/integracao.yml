name: Verificar integração da Mini Fazenda
on:
  push:
    branches: [integracao-html-2026-10-29]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check public/online-ui.js
      - run: node --check public/online.js

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: python3 -m http.server 8080 --directory public > /tmp/mini-fazenda-http.log 2>&1 &
      - run: npm run test:browser

  navegador-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps webkit
      - run: python3 -m http.server 8080 --directory public > /tmp/mini-fazenda-http.log 2>&1 &
      - run: MF_BROWSER=webkit node tests/legacy-account-browser.cjs && MF_BROWSER=webkit node tests/barn-click-browser.cjs && MF_BROWSER=webkit node tests/beta-regressions.cjs && MF_BROWSER=webkit node tests/offline-growth-browser.cjs

  regras-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase@12.5.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.22.0
      - run: npm run test:rules
