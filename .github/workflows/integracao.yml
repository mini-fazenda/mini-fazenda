name: Verificar integração da Mini Fazenda
on:
  push:
    branches: [integracao-html-2026-10-29]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check public/online-ui.js
      - run: node --check public/online.js

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: python3 -m http.server 8080 --directory public > /tmp/mini-fazenda-http.log 2>&1 &
      - run: bash scripts/run-browser-tests.sh $(node -p "require('./package.json').scripts['test:browser'].match(/tests\\/[\\w-]+\\.cjs/g).join(' ')")

  navegador-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps webkit
      - run: python3 -m http.server 8080 --directory public > /tmp/mini-fazenda-http.log 2>&1 &
      - run: MF_BROWSER=webkit bash scripts/run-browser-tests.sh tests/public-visit-repair-browser.cjs tests/live-visits-browser.cjs tests/camera-performance-browser.cjs tests/level-rewards-browser.cjs tests/move-controls-browser.cjs tests/flags-pigs-browser.cjs tests/pigsty-browser.cjs tests/legacy-account-browser.cjs tests/barn-click-browser.cjs tests/beta-regressions.cjs tests/offline-growth-browser.cjs tests/release-browser.cjs tests/crop-identity-browser.cjs tests/highdpi-browser.cjs

  regras-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase@12.5.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.22.0
      - run: npm run test:rules
