name: Publicar Mini Fazenda
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Identificar versão publicada
        run: |
          python3 - <<'PYVERSION'
          import os, re
          from pathlib import Path
          p = Path('public/index.html')
          s, count = re.subn(r'online\.js\?v=[^"\s]+', 'online.js?v=' + os.environ['GITHUB_SHA'], p.read_text())
          if count != 1:
              raise SystemExit('Não foi possível identificar a versão do host')
          p.write_text(s)
          PYVERSION
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
